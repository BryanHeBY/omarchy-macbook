<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Prefer Sarasa UI SC for Chinese UI and Sarasa Mono SC for monospace text, with Noto CJK fallback. -->
<fontconfig>
<alias binding="strong"><family>sans-serif</family><accept><family>Sarasa UI SC</family><family>Noto Sans CJK SC</family></accept></alias>
<alias binding="strong"><family>Liberation Sans</family><accept><family>Sarasa UI SC</family><family>Noto Sans CJK SC</family></accept></alias>
<alias><family>serif</family><accept><family>Noto Serif CJK SC</family></accept></alias>
<alias><family>Liberation Serif</family><accept><family>Noto Serif CJK SC</family></accept></alias>
<alias binding="strong"><family>monospace</family><accept><family>Sarasa Mono SC</family><family>Noto Sans Mono CJK SC</family></accept></alias>
<alias binding="strong"><family>JetBrainsMono Nerd Font</family><accept><family>Sarasa Mono SC</family><family>Noto Sans Mono CJK SC</family></accept></alias>
</fontconfig>
