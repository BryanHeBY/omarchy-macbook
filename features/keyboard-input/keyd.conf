# Apple SPI Keyboard capabilities/name fingerprint, shared by supported M1 keyboards.
# The trackpad shares 05ac:0281, so the complete keyd identifier is required.
[ids]
05ac:0281:2bd1f3de

[global]
# A solitary Fn held beyond this interval does not switch input on release.
overload_tap_timeout = 350

[main]
# Short taps switch input. Holding sends one native Caps Lock and enters its layer.
capslock = timeout(f13, 350, togglem(uppercase, macro(f14 capslock)))
fn = overload(globe, f13)

[uppercase]
# Exit uppercase on the next press without also switching input sources.
capslock = togglem(uppercase, macro(capslock))
# Switching input sources with Fn first clears uppercase.
fn = overload(globe, togglem(uppercase, macro(capslock f13)))

[globe]
# A combination consumes the solitary Fn action. Driver-translated keys pass through.
e = f15
up = pageup
down = pagedown
left = home
right = end
backspace = delete
